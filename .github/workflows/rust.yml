name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: runtime3/rust

    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | sed 's/.*= //' | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime3/rust

      - name: Build (default)
        run: cargo build

      - name: Build (std + tokio + serde + llm)
        run: cargo build --features tokio,serde,llm

      - name: Build (alloc / no_std)
        run: cargo build --no-default-features --features alloc

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings
